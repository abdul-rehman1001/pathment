# Dependabot version updates.
#
# Tuned deliberately, because the defaults produced 15 pull requests in one day.
# Three changes make it usable:
#   groups        one grouped PR per area instead of one PR per package
#   ignore        major bumps are done on purpose, not by a bot
#   monthly       weekly was noise for a project this size
#
# PRs target the default branch (`main`) on purpose. Pointing them at `staging`
# via `target-branch` also turns OFF automatic Dependabot SECURITY pull requests,
# and keeping those is worth more than the tidier branch flow.
version: 2
updates:
  # ── Backend ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      server-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # ── Web app ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /client-interface
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      client-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # ── CI workflows ───────────────────────────────────────────────────────────
  # Actions are pinned by major (actions/checkout@v4), so majors are ignored here
  # too. Bumping those changes how CI runs and should be a deliberate decision.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
